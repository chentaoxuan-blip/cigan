<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>词·感应</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif; background: #f5f4f0; color: #1a1a1a; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem 4rem; }
  .game { width: 100%; max-width: 520px; }
  .header { text-align: center; margin-bottom: 2rem; }
  .header h1 { font-size: 28px; font-weight: 500; letter-spacing: 0.1em; color: #1a1a1a; }
  .header p { font-size: 13px; color: #888; margin-top: 6px; }
  .card { background: #fff; border-radius: 14px; border: 0.5px solid #e0deda; padding: 1.25rem; margin-bottom: 1rem; }
  .label { font-size: 11px; font-weight: 500; color: #aaa; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; display: block; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text] { flex: 1; height: 40px; padding: 0 12px; border: 0.5px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; color: #1a1a1a; background: #fafaf8; outline: none; transition: border-color 0.15s; }
  input[type=text]:focus { border-color: #999; background: #fff; }
  .btn-primary { height: 40px; padding: 0 20px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 500; white-space: nowrap; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.8; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-ghost { height: 40px; padding: 0 16px; background: transparent; border: 0.5px solid #ccc; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; color: #444; transition: background 0.15s; }
  .btn-ghost:hover { background: #f0ede8; }
  .difficulty-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .diff-btn { padding: 12px; border-radius: 10px; border: 1.5px solid #e0deda; background: #fafaf8; cursor: pointer; text-align: left; font-family: inherit; transition: all 0.15s; }
  .diff-btn:hover { border-color: #aaa; background: #fff; }
  .diff-btn.selected { border-color: #1a1a1a; background: #fff; }
  .diff-btn.hell.selected { border-color: #c0392b; background: #fff8f7; }
  .diff-name { font-size: 14px; font-weight: 500; color: #1a1a1a; margin-bottom: 2px; }
  .diff-desc { font-size: 11px; color: #999; line-height: 1.4; }
  .diff-btn.hell .diff-name { color: #c0392b; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; gap: 8px; }
  .status-text { font-size: 13px; color: #888; flex: 1; }
  .count-badge { background: #eee; border-radius: 20px; padding: 3px 11px; font-size: 12px; font-weight: 500; color: #444; white-space: nowrap; }
  .timer-badge { background: #fff0ee; border-radius: 20px; padding: 3px 11px; font-size: 12px; font-weight: 500; color: #c0392b; white-space: nowrap; }
  .timer-badge.urgent { animation: pulse 0.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  .hint-banner { background: #fffbea; border: 0.5px solid #f0d060; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; font-size: 13px; color: #7a5c00; display: flex; gap: 8px; align-items: flex-start; }
  .hint-banner .hint-icon { flex-shrink: 0; font-size: 15px; }
  .guess-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1rem; }
  .guess-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fafaf8; border-radius: 10px; border: 0.5px solid #e8e5e0; }
  .guess-rank { font-size: 11px; color: #bbb; width: 16px; text-align: center; flex-shrink: 0; }
  .guess-word { font-size: 15px; font-weight: 500; color: #1a1a1a; min-width: 60px; }
  .bar-wrap { flex: 1; height: 5px; background: #e8e5e0; border-radius: 3px; overflow: hidden; }
  .bar { height: 100%; border-radius: 3px; transition: width 0.5s cubic-bezier(0.25,0.46,0.45,0.94); }
  .guess-pct { font-size: 13px; font-weight: 500; min-width: 42px; text-align: right; }
  .loading-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fafaf8; border-radius: 10px; font-size: 13px; color: #888; }
  .spinner { width: 14px; height: 14px; border: 1.5px solid #ddd; border-top-color: #555; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .win-card { background: #f0faf4; border: 0.5px solid #a8dfc0; border-radius: 14px; padding: 1.5rem; text-align: center; margin-bottom: 1rem; }
  .win-word { font-size: 32px; font-weight: 500; color: #1a7a4a; margin-bottom: 6px; }
  .win-msg { font-size: 14px; color: #2a9a5a; }
  .lose-card { background: #fff5f5; border: 0.5px solid #f5c0c0; border-radius: 14px; padding: 1.5rem; text-align: center; margin-bottom: 1rem; }
  .lose-word { font-size: 32px; font-weight: 500; color: #c0392b; margin-bottom: 6px; }
  .lose-msg { font-size: 14px; color: #c0392b; }
  .error { font-size: 13px; color: #c0392b; padding: 8px 12px; background: #fdf0ee; border-radius: 8px; margin-bottom: 8px; border: 0.5px solid #f5c6c0; }
  .setup-row { margin-bottom: 10px; }
  .center { text-align: center; margin-top: 1rem; }
  .divider { font-size: 11px; color: #bbb; text-align: center; margin: 12px 0 10px; }
</style>
</head>
<body>
<div class="game">
  <div class="header">
    <h1>词 · 感应</h1>
    <p>猜出那个隐藏的词 — 每次猜词显示与答案的语义关联度</p>
  </div>

  <div class="card" id="setupCard">
    <span class="label">选择难度</span>
    <div class="difficulty-grid">
      <button class="diff-btn selected" data-diff="easy" onclick="selectDiff(this)">
        <div class="diff-name">😊 简单</div>
        <div class="diff-desc">无限次数，超30次有提示</div>
      </button>
      <button class="diff-btn" data-diff="normal" onclick="selectDiff(this)">
        <div class="diff-name">🤔 一般</div>
        <div class="diff-desc">无限次数，无提示</div>
      </button>
      <button class="diff-btn" data-diff="hard" onclick="selectDiff(this)">
        <div class="diff-name">😤 困难</div>
        <div class="diff-desc">限50次，无提示</div>
      </button>
      <button class="diff-btn hell" data-diff="hell" onclick="selectDiff(this)">
        <div class="diff-name">💀 地狱</div>
        <div class="diff-desc">限时3分钟，限20次，无任何提示</div>
      </button>
    </div>
    <div class="divider">— 或者出题考别人 —</div>
    <div class="setup-row">
      <input type="text" id="customAnswer" placeholder="输入答案词（留空则随机，最多5字）" maxlength="5" />
    </div>
    <div class="row">
      <button class="btn-primary" onclick="startGame()">开始游戏</button>
      <button class="btn-ghost" onclick="startGameCustom()">用上面的词</button>
    </div>
  </div>

  <div id="gameArea" style="display:none">
    <div class="status-bar">
      <span class="status-text" id="statusText">输入一个词试试</span>
      <span id="timerBadge" style="display:none" class="timer-badge">3:00</span>
      <span class="count-badge" id="countBadge">第 1 次</span>
    </div>

    <div id="winBanner" style="display:none"></div>
    <div id="hintBanner" style="display:none" class="hint-banner"><span class="hint-icon">💡</span><span id="hintText"></span></div>
    <div id="errorMsg" style="display:none" class="error"></div>

    <div class="card" id="inputCard">
      <div class="row">
        <input type="text" id="guessInput" placeholder="输入词语（最多5字）…" maxlength="5"
          onkeydown="if(event.key==='Enter')submitGuess()" />
        <button class="btn-primary" id="guessBtn" onclick="submitGuess()">猜</button>
      </div>
    </div>

    <div id="guessList" class="guess-list"></div>

    <div class="center">
      <button class="btn-ghost" onclick="resetGame()">换一局</button>
    </div>
  </div>
</div>

<script>
let answer = '', guesses = [], won = false, loading = false;
let difficulty = 'easy';
let timerInterval = null;
let timeLeft = 180;
let maxGuesses = Infinity;
let hintShown = false;

const WORDS = ['月亮','太阳','星空','海洋','森林','河流','山峰','草地','沙漠','冰川','云雾','彩虹','雪花','火焰','微风','浪花','彼岸','闪电','暴风','细雨','番茄','苹果','香蕉','橙子','西瓜','葡萄','草莓','樱桃','桃子','梨子','巧克力','冰淇淋','咖啡','茶叶','面条','饺子','蛋糕','奶茶','火锅','寿司','爱情','友情','孤独','自由','希望','记忆','秘密','勇气','温暖','寒冷','梦想','忧愁','喜悦','平静','迷失','觉醒','思念','嫉妒','宽容','遗忘','奔跑','飞翔','漂浮','沉默','歌唱','哭泣','微笑','拥抱','放弃','坚持','迷茫','爆炸','融化','消失','绽放','凋落','追逐','躲藏','呼吸','沸腾','巨大','渺小','漆黑','洁白','炽热','冰冷','柔软','坚硬','喧闹','寂静','陡峭','平坦','鲜艳','暗淡','甜蜜','苦涩','沉重','轻盈','模糊','清晰','城市','故乡','归途','春天','冬日','秋风','夏夜','黎明','黄昏','午夜','街道','地铁','图书馆','咖啡馆','游乐园','医院','学校','海滩','山顶','深渊','蝴蝶','蜜蜂','花朵','老虎','海豚','猫咪','狐狸','熊猫','鹦鹉','乌鸦','音乐','钢琴','吉他','足球','篮球','电影','书本','智慧','力量','黑暗','光明','时间','宇宙','镜子','影子','烟火','迷宫','钥匙'];

const DIFF_CONFIG = {
  easy:   { maxGuesses: Infinity, timer: false, hint: true,  hintAt: 30 },
  normal: { maxGuesses: Infinity, timer: false, hint: false, hintAt: 0  },
  hard:   { maxGuesses: 50,       timer: false, hint: false, hintAt: 0  },
  hell:   { maxGuesses: 20,       timer: true,  hint: false, hintAt: 0, seconds: 180 },
};

function selectDiff(btn) {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  difficulty = btn.dataset.diff;
}

function startGame() {
  answer = WORDS[Math.floor(Math.random() * WORDS.length)];
  initGame();
}

function startGameCustom() {
  const val = document.getElementById('customAnswer').value.trim();
  if (val.length < 1 || val.length > 5) { showError('请输入1到5个字的词'); return; }
  answer = val; initGame();
}

function initGame() {
  guesses = []; won = false; loading = false; hintShown = false;
  const cfg = DIFF_CONFIG[difficulty];
  maxGuesses = cfg.maxGuesses;

  document.getElementById('setupCard').style.display = 'none';
  document.getElementById('gameArea').style.display = 'block';
  document.getElementById('winBanner').style.display = 'none';
  document.getElementById('hintBanner').style.display = 'none';
  document.getElementById('guessList').innerHTML = '';
  document.getElementById('guessInput').value = '';
  document.getElementById('guessInput').disabled = false;
  document.getElementById('guessBtn').disabled = false;
  document.getElementById('inputCard').style.display = 'block';
  document.getElementById('errorMsg').style.display = 'none';

  if (cfg.timer) {
    timeLeft = cfg.seconds;
    document.getElementById('timerBadge').style.display = 'inline-block';
    updateTimer();
    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimer();
      if (timeLeft <= 0) endGame(false, '时间到！');
    }, 1000);
  } else {
    document.getElementById('timerBadge').style.display = 'none';
    clearInterval(timerInterval);
  }

  document.getElementById('guessInput').focus();
  updateCount();
}

function updateTimer() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  const el = document.getElementById('timerBadge');
  el.textContent = `${m}:${String(s).padStart(2,'0')}`;
  if (timeLeft <= 30) el.classList.add('urgent');
  else el.classList.remove('urgent');
}

function resetGame() {
  clearInterval(timerInterval);
  document.getElementById('setupCard').style.display = 'block';
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('customAnswer').value = '';
  answer = ''; guesses = [];
}

function updateCount() {
  const cfg = DIFF_CONFIG[difficulty];
  const used = guesses.length + 1;
  if (cfg.maxGuesses === Infinity) {
    document.getElementById('countBadge').textContent = `第 ${used} 次`;
  } else {
    document.getElementById('countBadge').textContent = `${used} / ${cfg.maxGuesses}`;
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

async function submitGuess() {
  if (loading || won) return;
  const input = document.getElementById('guessInput');
  const word = input.value.trim();
  if (word.length < 1 || word.length > 5) { showError('请输入1到5个字的词'); return; }
  if (guesses.find(g => g.word === word)) { showError('已经猜过这个词了'); return; }

  loading = true;
  document.getElementById('guessBtn').disabled = true;
  input.value = '';

  const listEl = document.getElementById('guessList');
  const loadingEl = document.createElement('div');
  loadingEl.className = 'loading-row';
  loadingEl.innerHTML = `<div class="spinner"></div><span>正在感应「${word}」…</span>`;
  listEl.prepend(loadingEl);

  try {
    const result = await getSimilarity(word, answer);
    loadingEl.remove();
    guesses.push({ word, pct: result.score });
    guesses.sort((a, b) => b.pct - a.pct);
    renderGuesses();

    const cfg = DIFF_CONFIG[difficulty];

    if (result.isSynonym || word === answer || result.score >= 99) {
      clearInterval(timerInterval);
      showWin(guesses.length, word, result.isSynonym);
      won = true;
    } else {
      if (cfg.hint && !hintShown && guesses.length >= cfg.hintAt) {
        hintShown = true;
        showHint();
      }
      if (cfg.maxGuesses !== Infinity && guesses.length >= cfg.maxGuesses) {
        endGame(false, `已用完 ${cfg.maxGuesses} 次机会，`);
      } else {
        updateCount();
        document.getElementById('guessInput').focus();
      }
    }
  } catch(e) {
    loadingEl.remove();
    showError('请求失败，请重试');
  }

  loading = false;
  if (!won) document.getElementById('guessBtn').disabled = false;
}

async function getSimilarity(guess, target) {
  if (guess === target) return { score: 100, isSynonym: true };
  const resp = await fetch('/api/similarity', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ guess, target }),
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return await resp.json();
}

async function showHint() {
  const hintEl = document.getElementById('hintBanner');
  const hintText = document.getElementById('hintText');
  hintText.textContent = '正在生成提示…';
  hintEl.style.display = 'flex';
  try {
    const resp = await fetch('/api/hint', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answer }),
    });
    const data = await resp.json();
    hintText.textContent = data.hint || '继续加油，答案就在不远处';
  } catch {
    hintText.textContent = '继续加油，答案就在不远处';
  }
}

function endGame(isWin, msg) {
  clearInterval(timerInterval);
  won = true;
  document.getElementById('inputCard').style.display = 'none';
  document.getElementById('guessBtn').disabled = true;
  document.getElementById('guessInput').disabled = true;
  const banner = document.getElementById('winBanner');
  banner.style.display = 'block';
  if (isWin) {
    banner.innerHTML = `<div class="win-card"><div class="win-word">${answer} ✓</div><div class="win-msg">${msg}</div></div>`;
  } else {
    banner.innerHTML = `<div class="lose-card"><div class="lose-word">${answer}</div><div class="lose-msg">${msg}答案是「${answer}」</div></div>`;
  }
  document.getElementById('statusText').textContent = '游戏结束';
  document.getElementById('countBadge').textContent = `共 ${guesses.length} 次`;
}

function showWin(count, guessedWord, isSynonym) {
  const msg = guessedWord === answer
    ? `猜对了！共猜了 ${count} 次`
    : isSynonym
      ? `「${guessedWord}」与答案是同义词，共猜了 ${count} 次`
      : `猜对了！共猜了 ${count} 次`;
  endGame(true, msg);
}

function barColor(pct) {
  if (pct >= 80) return '#1a7a4a';
  if (pct >= 50) return '#b07010';
  if (pct >= 25) return '#2a70c0';
  return '#999';
}

function renderGuesses() {
  const listEl = document.getElementById('guessList');
  listEl.innerHTML = '';
  guesses.forEach((g, i) => {
    const c = barColor(g.pct);
    const row = document.createElement('div');
    row.className = 'guess-row';
    row.innerHTML = `
      <span class="guess-rank">${i + 1}</span>
      <span class="guess-word">${g.word}</span>
      <div class="bar-wrap"><div class="bar" style="width:${g.pct.toFixed(2)}%;background:${c}"></div></div>
      <span class="guess-pct" style="color:${c}">${g.pct.toFixed(2)}%</span>`;
    listEl.appendChild(row);
  });
}
</script>
</body>
</html>
